[project]
name = "schoolscripts"
version = "0.1.0"
description = "Grade 1 heart words and sight words for daily practice, flashcards, and printing."
readme = "README.md"
requires-python = ">=3.11.3"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.main:app"
