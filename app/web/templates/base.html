<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Today{% endblock %} · Heart words</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <div class="sheet">
    <header class="top">
      <a class="brand" href="/">Heart words</a>
      <nav>
        <a href="/" {% if page == "daily" %}aria-current="page"{% endif %}>Today</a>
        <a href="/cards" {% if page == "cards" %}aria-current="page"{% endif %}>Cards</a>
        <a href="/words" {% if page == "words" %}aria-current="page"{% endif %}>Word list</a>
      </nav>
    </header>
    <main>
      {% block body %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
